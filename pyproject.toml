[project]
name = "mltp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.0.0",
    "boto3>=1.43.75",
    "dvc[s3]>=3.67.1",
    "huggingface-hub>=1.32.0",
    "ipykernel>=7.3.0",
    "kagglehub>=0.3.0",
    "matplotlib>=3.9.0",
    "mlflow>=3.16.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "sympy>=1.13.0",
    "tensorflow[and-cuda]>=2.21.0",
    "torch>=2.13.0,<2.14.0",
    "torchvision>=0.28.0,<0.29.0",
    "tqdm>=4.66.0",
    "transformers>=5.20.0,<6.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
