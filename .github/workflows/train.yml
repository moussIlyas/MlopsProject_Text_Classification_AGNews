name: Train AG News (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # CML commit comments
  pull-requests: write   # CML PR comments (if we add PR triggers later)

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: sklearn training (1% data) on self-hosted runner
    # "self-hosted", "linux", "x64" are added automatically; "python" comes
    # from RUNNER_LABELS in runner/.env
    runs-on: [self-hosted, linux, x64, python]
    timeout-minutes: 30

    env:
      UV_PYTHON: "3.13"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      # Neon (MLflow metadata)
      NEON_PGUSER: ${{ secrets.NEON_PGUSER }}
      NEON_PGPASSWORD: ${{ secrets.NEON_PGPASSWORD }}
      NEON_PGHOST: ${{ secrets.NEON_PGHOST }}
      NEON_PGPORT: ${{ secrets.NEON_PGPORT }}
      NEON_PGDATABASE: ${{ secrets.NEON_PGDATABASE }}
      NEON_SSLMODE: ${{ secrets.NEON_SSLMODE }}
      # HF S3 gateway (DVC pull + explicit artifact upload)
      HF_S3_ACCESS_KEY: ${{ secrets.HF_S3_ACCESS_KEY }}
      HF_S3_SECRET_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      # MLflow's boto3 client must use the HF endpoint, not real AWS S3
      MLFLOW_S3_ENDPOINT_URL: https://s3.hf.co/moussll

    steps:
      - name: Checkout (full history for DVC)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner
        run: |
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS    : ${RUNNER_OS:-unknown}"
          python3 --version || true
          uv --version

      - name: Install dependencies from lockfile
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Pull dataset from HF bucket (DVC)
        run: uv run dvc pull

      - name: Run data validation tests
        run: uv run --group dev python -m pytest tests/ -q

      - name: Train and publish artifacts
        run: uv run python train.py

      - name: List local artifacts
        run: ls -lh artifacts/

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CML_WATERMARK: false
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("artifacts/metrics.json").read_text())
          info = json.loads(Path("artifacts/run_info.json").read_text())

          report = f"""## 🏋️ AG News Training Report

          **Date (UTC)**: {info['date']}

          ### Metrics
          | key | value |
          | --- | --- |
          | accuracy | {metrics['accuracy']:.4f} |
          | data_fraction | {metrics['data_fraction']} |
          | seed | {metrics['seed']} |

          ### Versions
          | package | version |
          | --- | --- |
          | python | {info['versions']['python']} |
          | scikit-learn | {info['versions']['scikit-learn']} |
          | joblib | {info['versions']['joblib']} |
          | numpy | {info['versions']['numpy']} |
          | pandas | {info['versions']['pandas']} |

          ### Confusion Matrix
          ![confusion matrix](./artifacts/confusion_matrix.png)

          ### Full details
          See `artifacts/run_info.json` for the complete configuration and classification report.
          """
          Path("report.md").write_text(report)
          PY
          cml comment create report.md

      - name: Build and push packaged model image (Docker Hub)
        # Option C: model.joblib + artifacts are baked into a versioned image.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          IMAGE="$DOCKERHUB_USERNAME/agnews-model"
          SHORT="${GITHUB_SHA::12}"
          docker build --build-context artifacts=artifacts/ -f serve/Dockerfile \
            -t "$IMAGE:$SHORT" -t "$IMAGE:0.1.0" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$SHORT" "Wall Street stocks rally higher"
          docker push "$IMAGE:$SHORT"
          docker push "$IMAGE:0.1.0"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:$SHORT"

      - name: Keep a copy as GitHub artifact (optional backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          if-no-files-found: warn
